<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin gabrielgarronedev@gmail.com
    ServerName sadikoi.missclick.net

    DocumentRoot /var/www/Sadikoi/browser

    ErrorLog ${APACHE_LOG_DIR}/sadikoi-error.log
    CustomLog ${APACHE_LOG_DIR}/sadikoi-access.log combined

    <Directory /var/www/Sadikoi/browser>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLCertificateFile /etc/letsencrypt/live/sadikoi.missclick.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sadikoi.missclick.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- Slowloris / slow-body protection ---
    RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
    Timeout 30
    KeepAliveTimeout 5

    # --- Request size limits (profile pictures are the largest legitimate body) ---
    LimitRequestBody 5242880
    LimitRequestFields 50
    LimitRequestFieldSize 8190
    LimitRequestLine 4094

    # --- Per-IP flood protection (mod_evasive) ---
    <IfModule mod_evasive20.c>
        DOSHashTableSize    3097
        DOSPageCount        20
        DOSSiteCount        200
        DOSPageInterval     1
        DOSSiteInterval     1
        DOSBlockingPeriod   60
    </IfModule>

    # --- Proxy to the Flask API (Gunicorn on 127.0.0.1:8082) ---
    # Required modules: proxy proxy_http proxy_wstunnel headers rewrite ssl
    # The Flask app trusts exactly ONE proxy hop (ProxyFix x_for=1): this vhost must be
    # the only way to reach it.
    ProxyPreserveHost On
    # Must stay well above the Socket.IO ping interval (25 s), or WebSockets get cut.
    ProxyTimeout 120
    # mod_proxy appends the client IP to X-Forwarded-For; ProxyFix reads the last entry.
    RequestHeader set X-Forwarded-Proto "https"

    # WebSocket upgrade (Socket.IO), matched before the plain HTTP proxy below.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:8082/socket.io/$1 [P,L]

    ProxyPass        /socket.io/ http://127.0.0.1:8082/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:8082/socket.io/
    ProxyPass        /api/ http://127.0.0.1:8082/api/
    ProxyPassReverse /api/ http://127.0.0.1:8082/api/

    # Never reveal server details.
    ServerSignature Off
</VirtualHost>
</IfModule>
