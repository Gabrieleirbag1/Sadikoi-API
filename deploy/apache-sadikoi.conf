# Example Apache vhost for the Sadikoi API (reverse proxy to Flask on 127.0.0.1:8082).
# Required modules: proxy proxy_http proxy_wstunnel headers reqtimeout rewrite ssl
# Optional: evasive (mod_evasive) or qos, security2 (ModSecurity + OWASP CRS)
#
# The Flask app trusts exactly ONE proxy hop (ProxyFix x_for=1): Flask must listen on
# 127.0.0.1 only, and this vhost must be the only way to reach it.

<VirtualHost *:443>
    ServerName sadikoi.missclick.net

    SSLEngine on
    # SSLCertificateFile / SSLCertificateKeyFile ...

    # --- Slowloris / slow-body protection ---
    RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
    Timeout 30
    KeepAliveTimeout 5

    # --- Request size limits (profile pictures are the largest legitimate body) ---
    LimitRequestBody 5242880
    LimitRequestFields 50
    LimitRequestFieldSize 8190
    LimitRequestLine 4094

    # --- Per-IP flood protection (mod_evasive) ---
    <IfModule mod_evasive20.c>
        DOSHashTableSize    3097
        DOSPageCount        20
        DOSSiteCount        200
        DOSPageInterval     1
        DOSSiteInterval     1
        DOSBlockingPeriod   60
    </IfModule>

    # --- Proxy ---
    ProxyPreserveHost On
    ProxyTimeout 30
    # mod_proxy appends the client IP to X-Forwarded-For; ProxyFix reads the last entry.
    RequestHeader set X-Forwarded-Proto "https"

    # WebSocket (Socket.IO) must be matched before the generic API proxy.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:8082/socket.io/$1 [P,L]

    ProxyPass        /socket.io/ http://127.0.0.1:8082/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:8082/socket.io/
    ProxyPass        /api/ http://127.0.0.1:8082/api/
    ProxyPassReverse /api/ http://127.0.0.1:8082/api/

    # Never reveal server details.
    ServerSignature Off
</VirtualHost>
